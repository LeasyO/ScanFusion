name: Compilar ScanFusion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "2.0.${{ github.run_number }}"
  BUILD: "${{ github.run_number }}"

jobs:
  # 1) Sempre: IPA sem assinatura -> GitHub Release "latest" + fonte para SideStore/AltStore.
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto do Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project ScanFusion.xcodeproj \
            -target ScanFusion \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Release-iphoneos/ScanFusion.app || { echo "::error::Falhou. Erros:"; grep -E "error:" build.log | head -40; exit 1; }

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ScanFusion.app Payload/
          zip -qry ScanFusion.ipa Payload

      - name: Gerar fonte do SideStore
        run: python3 scripts/make_source.py "${{ github.repository }}" "$VERSION" "$BUILD" ScanFusion.ipa

      - name: Publicar na Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScanFusion.ipa source.json \
            --title "ScanFusion $VERSION" \
            --notes "Instale pelo SideStore usando a fonte: https://github.com/${{ github.repository }}/releases/download/latest/source.json" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: ScanFusion-ipa
          path: |
            ScanFusion.ipa
            build.log
          retention-days: 30

  # 2) Opcional: com conta Apple Developer paga, envia sozinho para o TestFlight.
  testflight:
    runs-on: macos-latest
    steps:
      - name: Verificar se a conta de desenvolvedor foi configurada
        id: check
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$KEY_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Sem segredos da Apple: TestFlight pulado (normal no plano gratuito)."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Preparar
        if: steps.check.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"

      - name: Arquivar e enviar ao TestFlight
        if: steps.check.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          xcodebuild archive \
            -project ScanFusion.xcodeproj -scheme ScanFusion -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScanFusion.xcarchive" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            $AUTH
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ScanFusion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            $AUTH
